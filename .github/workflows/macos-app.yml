name: Build macOS simulator
on:
  workflow_dispatch:
  push:
    branches: [arena/b9aa48c9-virtual-ai-keychain]
    paths:
      - 'macos/**'
      - 'preview/**'
      - '.github/workflows/macos-app.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test && npm run voices:check
      - name: Build app and report compiler diagnostics
        shell: bash
        run: |
          set +e
          bash macos/build.sh > mac-build.log 2>&1
          code=$?
          cat mac-build.log
          if [ "$code" -ne 0 ]; then
            python3 -c 'from pathlib import Path; text=Path("mac-build.log").read_text(); print("::error::"+text[-12000:].replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          fi
          exit "$code"
      - name: Native app smoke test (no microphone permission prompt)
        run: '"artifacts/Keychain Simulator.app/Contents/MacOS/KeychainSimulator" --smoke-test'
      - name: Validate disk image
        run: hdiutil verify artifacts/Keychain-Simulator-macOS-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Keychain-Simulator-macOS-universal
          path: |
            artifacts/Keychain-Simulator-macOS-universal.dmg
            artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
